<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #1e293b 0%, #0f172a 100%);
      padding: 1rem;
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .display {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 18px;
      padding: 20px;
      text-align: right;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      word-break: break-all;
    }

    .previous-operand {
      color: #94a3b8;
      font-size: 1.1rem;
      min-height: 1.5rem;
    }

    .current-operand {
      color: #f8fafc;
      font-size: 2.5rem;
      font-weight: 500;
      line-height: 1.2;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border-radius: 16px;
      border: none;
      font-size: 1.35rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease-in-out;
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    button:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-action {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    .btn-action:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .btn-operator {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    .btn-operator:hover {
      background: rgba(245, 158, 11, 0.2);
    }

    .btn-equals {
      background: #3b82f6;
      color: #ffffff;
      grid-column: span 2;
    }

    .btn-equals:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>
    <div class="keypad">
      <button class="btn-action" data-action="clear">AC</button>
      <button class="btn-action" data-action="delete">DEL</button>
      <button class="btn-action" data-action="percent">%</button>
      <button class="btn-operator" data-operation="÷">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="btn-operator" data-operation="×">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="btn-operator" data-operation="-">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="btn-operator" data-operation="+">+</button>

      <button data-number="0">0</button>
      <button data-number=".">.</button>
      <button class="btn-equals" data-action="calculate">=</button>
    </div>
  </div>

  <script>
    class Calculator {
      constructor(previousOperandTextElement, currentOperandTextElement) {
        this.previousOperandTextElement = previousOperandTextElement;
        this.currentOperandTextElement = currentOperandTextElement;
        this.clear();
      }

      clear() {
        this.currentOperand = '0';
        this.previousOperand = '';
        this.operation = undefined;
        this.shouldResetScreen = false;
      }

      delete() {
        if (this.shouldResetScreen) return;
        if (this.currentOperand === '0') return;
        if (this.currentOperand.length === 1) {
          this.currentOperand = '0';
        } else {
          this.currentOperand = this.currentOperand.slice(0, -1);
        }
      }

      appendNumber(number) {
        if (this.shouldResetScreen) {
          this.currentOperand = '';
          this.shouldResetScreen = false;
        }
        if (number === '.' && this.currentOperand.includes('.')) return;
        if (this.currentOperand === '0' && number !== '.') {
          this.currentOperand = number.toString();
        } else {
          this.currentOperand = this.currentOperand.toString() + number.toString();
        }
      }

      chooseOperation(operation) {
        if (this.currentOperand === '' && this.previousOperand === '') return;
        if (this.currentOperand === '' && this.previousOperand !== '') {
          this.operation = operation;
          return;
        }
        if (this.previousOperand !== '') {
          this.compute();
        }
        this.operation = operation;
        this.previousOperand = this.currentOperand;
        this.currentOperand = '';
      }

      percent() {
        if (this.currentOperand === '') return;
        this.currentOperand = (parseFloat(this.currentOperand) / 100).toString();
      }

      compute() {
        let computation;
        const prev = parseFloat(this.previousOperand);
        const current = parseFloat(this.currentOperand);
        if (isNaN(prev) || isNaN(current)) return;

        switch (this.operation) {
          case '+':
            computation = prev + current;
            break;
          case '-':
            computation = prev - current;
            break;
          case '×':
            computation = prev * current;
            break;
          case '÷':
            if (current === 0) {
              alert("Cannot divide by zero");
              return;
            }
            computation = prev / current;
            break;
          default:
            return;
        }

        computation = Math.round(computation * 1e12) / 1e12;
        this.currentOperand = computation.toString();
        this.operation = undefined;
        this.previousOperand = '';
        this.shouldResetScreen = true;
      }

      updateDisplay() {
        this.currentOperandTextElement.innerText = this.currentOperand;
        if (this.operation != null) {
          this.previousOperandTextElement.innerText = `${this.previousOperand} ${this.operation}`;
        } else {
          this.previousOperandTextElement.innerText = '';
        }
      }
    }

    const previousOperandTextElement = document.getElementById('previous-operand');
    const currentOperandTextElement = document.getElementById('current-operand');
    const calculator = new Calculator(previousOperandTextElement, currentOperandTextElement);

    document.querySelectorAll('[data-number]').forEach(button => {
      button.addEventListener('click', () => {
        calculator.appendNumber(button.getAttribute('data-number'));
        calculator.updateDisplay();
      });
    });

    document.querySelectorAll('[data-operation]').forEach(button => {
      button.addEventListener('click', () => {
        calculator.chooseOperation(button.getAttribute('data-operation'));
        calculator.updateDisplay();
      });
    });

    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.getAttribute('data-action');
        if (action === 'clear') calculator.clear();
        if (action === 'delete') calculator.delete();
        if (action === 'calculate') calculator.compute();
        if (action === 'percent') calculator.percent();
        calculator.updateDisplay();
      });
    });

    window.addEventListener('keydown', e => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        calculator.appendNumber(e.key);
      } else if (e.key === '+') {
        calculator.chooseOperation('+');
      } else if (e.key === '-') {
        calculator.chooseOperation('-');
      } else if (e.key === '*') {
        calculator.chooseOperation('×');
      } else if (e.key === '/') {
        e.preventDefault();
        calculator.chooseOperation('÷');
      } else if (e.key === '%' ) {
        calculator.percent();
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculator.compute();
      } else if (e.key === 'Backspace') {
        calculator.delete();
      } else if (e.key === 'Escape') {
        calculator.clear();
      }
      calculator.updateDisplay();
    });
  </script>
</body>
</html>
